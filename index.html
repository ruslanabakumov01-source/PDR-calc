function shrink(src,max,q){return new Promise(res=>{const im=new Image();im.onload=()=>{try{let w=im.naturalWidth,h=im.naturalHeight;if(!w||!h){res(null);return}const k=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q))}catch(e){res(null)}};im.onerror=()=>res(null);im.src=src})}
async function viaBitmap(f,max,q){try{const bm=await createImageBitmap(f);const k=Math.min(1,max/Math.max(bm.width,bm.height));const w=Math.max(1,Math.round(bm.width*k)),h=Math.max(1,Math.round(bm.height*k));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bm,0,0,w,h);return c.toDataURL('image/jpeg',q)}catch(e){return null}}

const BLK=[[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
[-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
[-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]];
const FMT={L:1,M:0,Q:3,H:2},LV={L:0,M:1,Q:2,H:3};
function rawModules(v){let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r}
function dataCodewords(v,l){return Math.floor(rawModules(v)/8)-ECC[l][v]*BLK[l][v]}
const EXP=new Array(512),LOG=new Array(256);(()=>{let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11D}for(let i=255;i<512;i++)EXP[i]=EXP[i-255]})();
const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
function rsDiv(deg){let r=new Array(deg).fill(0);r[deg-1]=1;let root=1;for(let i=0;i<deg;i++){for(let j=0;j<deg;j++){r[j]=mul(r[j],root);if(j+1<deg)r[j]^=r[j+1]}root=mul(root,2)}return r}
function rsRem(data,div){const r=new Array(div.length).fill(0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f)})}return r}
function encode(bytes,eccName){
  const l=LV[eccName];let v=1;
  for(;;v++){if(v>40)return null;const cap=dataCodewords(v,l)*8,need=4+(v<10?8:16)+bytes.length*8;if(need<=cap)break}
  const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
  put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
  const cap=dataCodewords(v,l)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
  for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
  const data=[];for(let i=0;i<bits.length;i+=8){let x=0;for(let j=0;j<8;j++)x=x<<1|bits[i+j];data.push(x)}
  const nb=BLK[l][v],eb=ECC[l][v],raw=Math.floor(rawModules(v)/8),ns=nb-raw%nb,sl=Math.floor(raw/nb),div=rsDiv(eb);
  const blocks=[];for(let i=0,k=0;i<nb;i++){const len=sl-eb+(i<ns?0:1);const d=data.slice(k,k+len);k+=len;const e=rsRem(d,div);if(i<ns)d.push(0);blocks.push(d.concat(e))}
  const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-eb||j>=ns)all.push(b[i])});
  const size=v*4+17,m=[],fn=[];for(let i=0;i<size;i++){m.push(new Array(size).fill(false));fn.push(new Array(size).fill(false))}
  const set=(x,y,d)=>{m[y][x]=d;fn[y][x]=true};
  for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)set(x,y,d!==2&&d!==4)}};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  const al=[];if(v>1){const n=Math.floor(v/7)+2,step=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2;al.push(6);for(let p=size-7;al.length<n;p-=step)al.splice(1,0,p)}
  al.forEach((cy,i)=>al.forEach((cx,j)=>{if((i===0&&j===0)||(i===0&&j===al.length-1)||(i===al.length-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(cx+dx,cy+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}));
  const fmtBits=mask=>{const d=FMT[eccName]<<3|mask;let r=d;for(let i=0;i<10;i++)r=r<<1^((r>>>9)*0x537);return (d<<10|r)^0x5412};
  const drawFmt=mask=>{const b=fmtBits(mask),g=i=>((b>>>i)&1)!==0;
    for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
    for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true)};
  drawFmt(0);
  if(v>=7){let r=v;for(let i=0;i<12;i++)r=r<<1^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bit=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);set(a,c,bit);set(c,a,bit)}}
  let k=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!fn[y][x]&&k<all.length*8){m[y][x]=((all[k>>>3]>>>(7-(k&7)))&1)!==0;k++}}}
  const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const apply=mk=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!fn[y][x]&&maskFn[mk](x,y))m[y][x]=!m[y][x]};
  const penalty=()=>{let res=0;const run=(line)=>{let p=0,c=line[0],n=1;for(let i=1;i<=line.length;i++){if(i<line.length&&line[i]===c)n++;else{if(n>=5)p+=3+n-5;if(i<line.length){c=line[i];n=1}}}
      return p};
    const fin=(line)=>{let p=0;const pat=[1,0,1,1,1,0,1],s=line.map(x=>x?1:0);for(let i=0;i+6<line.length;i++){let ok=true;for(let j=0;j<7;j++)if(s[i+j]!==pat[j]){ok=false;break}if(!ok)continue;const w=(a,b)=>{for(let q=a;q<b;q++)if(q>=0&&q<line.length&&s[q])return false;return true};if(w(i-4,i)||w(i+7,i+11))p+=40}return p};
    for(let y=0;y<size;y++){res+=run(m[y]);res+=fin(m[y])}
    for(let x=0;x<size;x++){const col=m.map(r=>r[x]);res+=run(col);res+=fin(col)}
    for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=m[y][x];if(c===m[y][x+1]&&c===m[y+1][x]&&c===m[y+1][x+1])res+=3}
    let dark=0;m.forEach(r=>r.forEach(c=>{if(c)dark++}));res+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10; /* approx */
    return res};
  let best=0,bp=1e9;for(let mk=0;mk<8;mk++){apply(mk);drawFmt(mk);const p=penalty();if(p<bp){bp=p;best=mk}apply(mk)}
  apply(best);drawFmt(best);
  return {size,version:v,m};
}
return {encode,dataCodewords:(v,n)=>dataCodewords(v,LV[n])};
})();


/* ===== Рахунок на оплату: картки реквізитів, QR НБУ, архів рахунків ===== */
let IV={cards:[],inv:[],sel:null};
try{const r=JSON.parse(localStorage.getItem('pdrinv')||'null');if(r&&Array.isArray(r.cards)){IV.cards=r.cards;IV.inv=Array.isArray(r.inv)?r.inv:[];IV.sel=r.sel||null}}catch(e){}
const ivSave=()=>{try{localStorage.setItem('pdrinv',JSON.stringify(IV))}catch(e){}};
const IVS={mode:'make',edit:null,made:null,mk:{amt:'',cur:'UAH',svc:''}};
const IVF={ua:[['recipient',1],['iban',1],['code',1],['bank',0],['mfo',0],['bcode',0]],sepa:[['recipient',1],['iban',1],['bic',1],['bank',0]],oth:[['recipient',1],['acc',1],['bic',0],['bank',0],['addr',0]]};
const IVL={recipient:'i_rec',iban:'i_iban',code:'i_code',bank:'i_bank',mfo:'i_mfo',bcode:'i_bcode',bic:'i_bic',acc:'i_acc',addr:'i_addr'};
const IVFM=['ua','sepa','oth'],IVFK={ua:'i_fua',sepa:'i_fsepa',oth:'i_foth'};
const ivClean=s=>String(s||'').replace(/\s+/g,'').toUpperCase();
function ibanOk(s){s=ivClean(s);if(!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(s))return false;const r=s.slice(4)+s.slice(0,4);let m=0;for(const c of r){const v=/\d/.test(c)?c:String(c.charCodeAt(0)-55);for(const d of v)m=(m*10+(+d))%97}return m===1}
const uaIban=s=>/^UA\d{27}$/.test(ivClean(s))&&ibanOk(s);
function ivParse(text){
  const f={};const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const ibRe=/\b[A-Za-z]{2}\d{2}(?: ?[A-Za-z0-9]){11,30}\b/;
  const takeIban=v=>{const m=String(v).match(ibRe);if(!m)return '';let c=ivClean(m[0]);if(c.startsWith('UA'))c=c.slice(0,29);return c};
  lines.forEach(ln=>{
    const k=ln.search(/[:：]/);const lab=(k>0?ln.slice(0,k):'').toLowerCase().trim(),val=(k>0?ln.slice(k+1):ln).trim();
    if(!f.iban){const ib=takeIban(ln);if(ib&&ibanOk(ib)){f.iban=ib}}
    if(k<=0)return;
    const isBank=/банк|bank/.test(lab);
    if(/(єдрпоу|едрпоу|edrpou|код)/.test(lab)&&isBank){const d=val.replace(/\D/g,'');if(d)f.bcode=d;return}
    if(/(єдрпоу|едрпоу|edrpou|іпн|ipn|рнокпп|tax|податк)/.test(lab)){const d=val.replace(/\D/g,'');if(d&&!f.code)f.code=d;return}
    if(/(мфо|mfo)/.test(lab)){const d=val.replace(/\D/g,'');if(d)f.mfo=d.slice(0,6);return}
    if(/(bic|swift)/.test(lab)){f.bic=val.replace(/\s/g,'').toUpperCase();return}
    if(/(iban|рахунок|р\/р|account|acc\.)/.test(lab)){const ib=takeIban(val);if(ib&&!f.iban)f.iban=ib;else if(!ib&&!f.acc)f.acc=val;return}
    if(/(отримувач|одержувач|получатель|recipient|beneficiary|payee|найменування|назва)/.test(lab)&&!isBank){if(!f.recipient)f.recipient=val;return}
    if(isBank||/(акціонерне|товариство)/.test(lab)){if(!f.bank)f.bank=val;return}
    if(/(адрес|address)/.test(lab)){f.addr=val;return}
  });
  if(!f.recipient){const l=lines.find(x=>/(^|\s)(фоп|тов|пп|llc|ltd|gmbh|s\.r\.o|sp\. z o\.o)/i.test(x)&&!/[:：]/.test(x));if(l)f.recipient=l}
  if(f.iban&&f.iban.startsWith('UA')&&!f.mfo)f.mfo=f.iban.slice(4,10);
  let fmt='oth';if(f.iban){fmt=f.iban.startsWith('UA')?'ua':'sepa'}
  return {f,fmt,n:Object.keys(f).length};
}
/* ---- QR НБУ (версія 003) ---- */
function nbuUrl(c,amt,purpose){
  if(c.fmt!=='ua'||!uaIban(c.f.iban)||!/^\d{8,10}$/.test(String(c.f.code||'').replace(/\s/g,'')))return null;
  const a=Math.round((+amt||0)*100)/100;if(!(a>0&&a<=999999999.99))return null;
  const am='UAH'+(Number.isInteger(a)?String(a):a.toFixed(2));
  const el=['BCD','003','1','UCT','',String(c.f.recipient||'').slice(0,140),ivClean(c.f.iban),am,String(c.f.code).replace(/\s/g,''),'','',String(purpose||'').slice(0,420),'','','','',''];
  const enc=new TextEncoder();let len=enc.encode(el.join('\n')).length;el[12]=' '.repeat((3-len%3)%3);
  const bytes=enc.encode(el.join('\n'));let bin='';bytes.forEach(b=>{bin+=String.fromCharCode(b)});
  return 'https://qr.bank.gov.ua/'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function ivQR(url){if(!url)return null;const by=Array.from(new TextEncoder().encode(url));let r=null;for(const e of ['Q','M','L']){const x=QR.encode(by,e);if(x&&(x.version<=16||e==='L')){r=x;break}}return r||QR.encode(by,'L')}

  return `<svg viewBox="0 0 ${n+2*Q} ${n+2*Q}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="${n+2*Q}" height="${n+2*Q}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}

async function ivImage(rec){
  try{const W=1080,P=64,c=document.createElement('canvas');c.width=W;c.height=3200;const x=c.getContext('2d'),F='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

    const text=(txt,font,col,gap)=>{wrap(txt,font,W-2*P).forEach(l=>{const h=parseInt(font.match(/(\d+)px/)[1]);y+=h;x.font=font;x.fillStyle=col;x.fillText(l,P,y);y+=Math.round(h*.3)});y+=gap||0};

    y+=4;text(ivMoney(rec.amt,rec.cur),'800 72px '+F,'#1D2127',20);

      x.font='400 26px '+F;x.fillStyle='#6B7280';x.textAlign='center';x.fillText(t('i_qr'),W/2,y+22);x.textAlign='left';y+=52}
    text(t('i_disc'),'400 22px '+F,'#9AA1AC',0);y+=P-10;
    const o=document.createElement('canvas');o.width=W;o.height=y;o.getContext('2d').drawImage(c,0,0);
    return await new Promise(res=>o.toBlob(b=>res(b),'image/png'))}catch(e){return null}}

/* ---------- геометрія ---------- */
function calib(){
  const r0=MS.refs[0];if(r0.pts.length<2)return null;
  const p0=r0.pts[0],p1=r0.pts[1],v1=[p1[0]-p0[0],p1[1]-p0[1]],n1=Math.hypot(v1[0],v1[1]);if(n1<4)return null;
  let A=[[r0.len/n1,0],[0,r0.len/n1]],twoOk=false,warn='';
  const r1=MS.refs[1];
  if(MS.two&&r1.pts.length>=2){
    const q0=r1.pts[0],q1=r1.pts[1],v2=[q1[0]-q0[0],q1[1]-q0[1]],n2=Math.hypot(v2[0],v2[1]);
    const c=v1[0]*v2[1]-v1[1]*v2[0];
    if(n2>=4&&Math.abs(c)/(n1*n2)>0.42){ /* кут між відрізками не менше ~25° */
      const s=c>0?1:-1,L1=r0.len,L2=r1.len;

      const i00=v2[1]/c,i01=-v2[0]/c,i10=-v1[1]/c,i11=v1[0]/c;
      A=[[L1*i00,L1*i01],[s*L2*i10,s*L2*i11]];twoOk=true;
      const ang=Math.acos(Math.max(-1,Math.min(1,(v1[0]*v2[0]+v1[1]*v2[1])/(n1*n2))))*180/Math.PI;
      /* сингулярні значення A: анізотропія */
      const a=A[0][0],b=A[0][1],cc=A[1][0],d=A[1][1],S1=a*a+b*b+cc*cc+d*d,D=a*d-b*cc,sq=Math.sqrt(Math.max(0,S1*S1-4*D*D));

const toCm=(C,p)=>{const x=p[0]-C.o[0],y=p[1]-C.o[1];return[C.A[0][0]*x+C.A[0][1]*y,C.A[1][0]*x+C.A[1][1]*y]};
const toImg=(C,q)=>{const x=C.inv[0][0]*q[0]+C.inv[0][1]*q[1],y=C.inv[1][0]*q[0]+C.inv[1][1]*q[1];return[x+C.o[0],y+C.o[1]]};
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(P.length<3)return P;const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);

function paint(c,tx,ty,k,loupe){

/* ---------- жести ---------- */
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
function hitHandle(sx,sy){let best=null,bd=28*28;MS.refs.forEach((r,ri)=>{if(ri===1&&!MS.two)return;r.pts.forEach((p,i)=>{if(ri===1&&i===0)return;const s=scr(p[0],p[1]),d=(s[0]-sx)**2+(s[1]-sy)**2;if(d<bd){bd=d;best={ri,i,s}}})});return best}
function addPoint(ix,iy){
  if(!(ix>=0&&iy>=0&&ix<=MS.iw&&iy<=MS.ih))return;
  let ri=MS.cur;if(MS.refs[ri].pts.length>=2){if(MS.two&&ri===0&&MS.refs[1].pts.length<2)ri=MS.cur=1;else return}
  MS.refs[ri].pts.push([ix,iy]);syncLink();
  if(MS.two&&ri===0&&MS.refs[0].pts.length===2)MS.cur=1;
  ui();redraw();
}
function startPinch(){const a=[...MS.ptrs.values()];const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1,c=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2];
  MS.g={type:'pinch',d0:d,k0:MS.k,ip:img(c[0],c[1])};MS.lpt=null}
function onDown(e){
  e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pos(e);MS.ptrs.set(e.pointerId,p);
  if(MS.ptrs.size===2){if(MS.g&&MS.g.type==='draw'){MS.stroke=[]}startPinch();return}
  if(MS.ptrs.size>2)return;
  if(MS.step===1){
    const h=hitHandle(p[0],p[1]);
    if(h){MS.g={type:'h',ri:h.ri,i:h.i,dx:h.s[0]-p[0],dy:h.s[1]-p[1]};MS.lpt=MS.refs[h.ri].pts[h.i];MS.lsp=p;redraw();return}
    MS.g={type:'tap',sx:p[0],sy:p[1],t0:Date.now(),tx0:MS.tx,ty0:MS.ty,moved:false};return;
  }
  if(MS.step===2&&MS.mode==='draw'){
    const ip=img(p[0],p[1]);MS.g={type:'draw'};MS.stroke=[ip];MS.res=null;MS.lpt=ip;MS.lsp=p;ui();redraw();return;
  }
  MS.g={type:'pan',sx:p[0],sy:p[1],tx0:MS.tx,ty0:MS.ty};
}
function onMove(e){
  if(!MS.ptrs.has(e.pointerId))return;const p=pos(e);MS.ptrs.set(e.pointerId,p);const g=MS.g;if(!g)return;
  if(g.type==='pinch'&&MS.ptrs.size>=2){const a=[...MS.ptrs.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1,c=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2];
    const nk=Math.min(MS.kfit*14,Math.max(MS.kfit*0.7,g.k0*d/g.d0));MS.k=nk;MS.tx=c[0]-g.ip[0]*nk;MS.ty=c[1]-g.ip[1]*nk;clampPan();redraw();return}
  if(g.type==='h'){const ip=img(p[0]+g.dx,p[1]+g.dy);ip[0]=Math.max(0,Math.min(MS.iw,ip[0]));ip[1]=Math.max(0,Math.min(MS.ih,ip[1]));MS.refs[g.ri].pts[g.i]=ip;if(g.ri===0&&g.i===0)syncLink();MS.lpt=ip;MS.lsp=p;redraw();return}
  if(g.type==='tap'){if(Math.hypot(p[0]-g.sx,p[1]-g.sy)>8)g.moved=true;if(g.moved){MS.tx=g.tx0+p[0]-g.sx;MS.ty=g.ty0+p[1]-g.sy;clampPan();redraw()}return}
  if(g.type==='pan'){MS.tx=g.tx0+p[0]-g.sx;MS.ty=g.ty0+p[1]-g.sy;clampPan();redraw();return}
  if(g.type==='draw'){const ip=img(p[0],p[1]),L=MS.stroke[MS.stroke.length-1];if(Math.hypot(ip[0]-L[0],ip[1]-L[1])*MS.k>1.6){MS.stroke.push(ip)}MS.lpt=ip;MS.lsp=p;redraw()}
}
function onUp(e){
  const g=MS.g,had=MS.ptrs.has(e.pointerId);MS.ptrs.delete(e.pointerId);if(!had)return;
  if(g&&g.type==='pinch'){if(MS.ptrs.size<2)MS.g=null;return}
  MS.g=null;MS.lpt=null;
  if(g&&g.type==='tap'&&!g.moved&&Date.now()-g.t0<600){const ip=img(g.sx,g.sy);addPoint(ip[0],ip[1])}
  if(g&&g.type==='h'){ui()}
  if(g&&g.type==='draw'){
    if(MS.stroke.length>=8){MS.shapes.push(MS.stroke);MS.res=null}
    MS.stroke=[];ui();
  }
  redraw();
}
function onWheel(e){e.preventDefault();const p=pos(e);zoomAt(e.deltaY<0?1.18:1/1.18,p[0],p[1])}

/* ---------- інтерфейс ---------- */
const sticker=()=>`<svg viewBox="0 0 320 190" role="img" aria-label="sticker"><rect x="8" y="8" width="304" height="174" rx="14" fill="var(--surface-secondary)" stroke="var(--border)"/>
<g stroke="var(--text-primary)" stroke-width="5" stroke-linecap="round" fill="none"><path d="M60 140H238M60 140V50"/></g>
<g fill="var(--accent)" stroke="var(--text-primary)" stroke-width="2.5"><circle cx="60" cy="140" r="8"/><circle cx="238" cy="140" r="8"/><circle cx="60" cy="50" r="8"/></g>
<g fill="var(--text-primary)" font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle"><text x="149" y="167">5 cm</text><text x="34" y="98" transform="rotate(-90 34 98)">2 in</text></g></svg>`;
function steps(){const n=[t('ms1'),t('ms2'),t('ms3')];return n.map((x,i)=>`<span class="${MS.step===i+1?'on':MS.step>i+1?'ok':''}">${MS.step>i+1?'✓ ':''}${x}</span>`).join('')}
function hint(){const h=root.querySelector('#msHint');if(!h)return;let k='';
  if(MS.step===1){const r=MS.refs[MS.cur];const done=MS.refs[0].pts.length===2&&(!MS.two||MS.refs[1].pts.length===2);k=done?'mh1c':(MS.cur===1?'mh1d':(r.pts.length===0?'mh1a':'mh1b'))}
  else if(MS.step===2)k=MS.shapes.length?'mh2b':'mh2';
  h.textContent=k?t(k):'';h.hidden=!k}
function ui(){
  if(!root)return;const st=MS.step;
  root.querySelector('#msSt').innerHTML=st?steps():'';
  root.querySelector('#msP').hidden=st!==0;root.querySelector('#msV').hidden=st===0;
  const F=root.querySelector('#msF');let h='';
  if(st===1){
    const r=MS.refs[MS.cur],ok=MS.refs[0].pts.length===2&&(!MS.two||MS.refs[1].pts.length===2);
    h+=`<div class="msrow"><span class="msl">${t('mlen')}${MS.two?' '+(MS.cur+1):''}</span><div class="seg"><button class="${r.len===R_CM?'':'sec'}" data-msl="${R_CM}">5 cm</button><button class="${r.len===R_IN?'':'sec'}" data-msl="${R_IN}">2 in</button></div></div>`;
    if(MS.two)h+=`<div class="seg" style="margin:0"><button class="${MS.cur===0?'':'sec'}" data-msc="0" style="min-height:40px">${t('mref')} 1</button><button class="${MS.cur===1?'':'sec'}" data-msc="1" style="min-height:40px">${t('mref')} 2</button></div>`;
    h+=`<div class="row"><button class="sec" data-msa="two">${MS.two?t('m2off'):t('m2on')}</button><button class="sec" data-msa="clr1">${t('mundo')}</button><button data-msa="next" ${ok?'':'disabled'}>${t('mnext')}</button></div>`;
  }else if(st===2){
    h+=`<div class="seg" style="margin:0"><button class="${MS.mode==='draw'?'':'sec'}" data-msm="draw" style="min-height:40px">${t('mdraw')}</button><button class="${MS.mode==='move'?'':'sec'}" data-msm="move" style="min-height:40px">${t('mmove')}</button><button class="sec" data-msa="clrall" style="min-height:40px" ${MS.shapes.length?'':'disabled'}>${t('mclr')}</button></div>`;
    const q=MS.shapes.length?compute():null;
    if(q)h+=`<div class="msres"><div class="mrr"><span>${t('mreg')}</span><b>${q.n}</b></div><div class="mrr"><span>${q.n>1?t('mtot'):t('marea')}</span><b>${fmt(dA(q.A))} ${UA()}</b></div></div>`;
    h+=`<div class="row"><button class="sec" data-msa="back1">${t('mback')}</button><button class="sec" data-msa="clr2" ${MS.shapes.length?'':'disabled'}>${t('mundol')}</button><button data-msa="next2" ${MS.shapes.length?'':'disabled'}>${t('mnext')}</button></div>`;
  }else if(st===3&&MS.res){
    const R=MS.res,w=R.C.warn;
    h+=`<div class="msres"><div class="mrr"><span>${R.n>1?t('mtot')+' · '+t('mreg')+' '+R.n:t('marea')}</span><b>${fmt(dA(R.A))} ${UA()}</b></div><div class="mrr"><span>${t('mbox')}</span><b>${fmt(dU(R.L))} × ${fmt(dU(R.W))} ${UL()}</b></div></div>`;
    if(R.n>1)h+=`<div class="msl">${R.regs.map((g,i)=>(i+1)+': '+fmt(dA(g.A))).join('  ·  ')} ${UA()}</div>`;
    if(w)h+=`<div class="mswarn">⚠ ${t(w)}</div>`;
    h+=`<div class="msopt"><label><input type="radio" name="msap" value="box" ${MS.apply==='box'?'checked':''}><span>${t('mo_box')}<small>${fmt(dU(R.L))} × ${fmt(dU(R.W))} ${UL()}</small></span></label><label><input type="radio" name="msap" value="area" ${MS.apply==='area'?'checked':''}><span>${t('mo_area')}<small>≈ ${fmt(dU(R.L2))} × ${fmt(dU(R.W2))} ${UL()}</small></span></label>${MS.edit?'':`<label><input type="checkbox" id="msPh" ${MS.addPh?'checked':''}><span>${t('mphoto')}</span></label>`}</div>`;
    h+=`<div class="row"><button class="sec" data-msa="back2">${t('mback')}</button><button data-msa="apply">${t('mapply')}</button></div>`;
  }
  F.innerHTML=h;F.hidden=!h;hint();
}
function build(){
  root=document.createElement('div');root.id='msr';root.className='shm msr';root.hidden=true;
  root.innerHTML=`<div class="msh"><b>${t('mt')}</b><button class="sec msx" data-msx="1" aria-label="${t('close')}">×</button></div><div class="mss" id="msSt"></div>
<div class="msb"><div class="msp" id="msP">${sticker()}<p>${t('mtip')}</p><label class="msbig">${MSIC}${t('mpick')}<input type="file" accept="image/*" id="msFile" hidden></label></div>
<div class="msv" id="msV" hidden><canvas id="msC"></canvas><canvas id="msL" class="mslp" hidden></canvas><div class="mshint" id="msHint" hidden></div></div></div><div class="msf" id="msF" hidden></div>`;
  document.body.appendChild(root);
  cv=root.querySelector('#msC');cx=cv.getContext('2d');lp=root.querySelector('#msL');lx=lp.getContext('2d');
  cv.addEventListener('pointerdown',onDown);cv.addEventListener('pointermove',onMove);cv.addEventListener('pointerup',onUp);cv.addEventListener('pointercancel',onUp);cv.addEventListener('wheel',onWheel,{passive:false});cv.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('resize',()=>{if(!root.hidden){resize();redraw()}});
  root.addEventListener('change',e=>{const x=e.target;
    if(x.id==='msFile'){const f=x.files&&x.files[0];x.value='';if(f)loadFile(f);return}
    if(x.name==='msap'){MS.apply=x.value;return}
    if(x.id==='msPh'){MS.addPh=x.checked}});
  root.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;const d=b.dataset;
    if(d.msx!==undefined){close();return}
    if(d.msl!==undefined){MS.refs[MS.cur].len=+d.msl;ui();return}
    if(d.msc!==undefined){MS.cur=+d.msc;ui();return}
    if(d.msm){MS.mode=d.msm;ui();return}
    const a=d.msa;if(!a)return;
    if(a==='two'){MS.two=!MS.two;if(!MS.two){MS.cur=0;MS.refs[1].pts=[]}else{syncLink();MS.cur=MS.refs[0].pts.length===2?1:0}ui();redraw()}
    else if(a==='clr1'){if(MS.cur===1){MS.refs[1].pts=[];syncLink();if(MS.refs[1].pts.length<=1&&false)MS.cur=0}else{MS.refs[0].pts=[];MS.refs[1].pts=[];MS.cur=0}ui();redraw()}
    else if(a==='next'){setStep(2)}
    else if(a==='back1'){setStep(1)}
    else if(a==='clrall'){MS.shapes=[];MS.stroke=[];MS.res=null;ui();redraw()}
    else if(a==='clr2'){MS.shapes.pop();MS.stroke=[];MS.res=null;ui();redraw()}
    else if(a==='next2'){MS.res=compute();if(!MS.res){toast(t('mnoc'));return}setStep(3)}
    else if(a==='back2'){setStep(2)}
    else if(a==='apply'){applyRes()}
  });
}
function setStep(n){MS.step=n;if(n===2)MS.res=null;ui();requestAnimationFrame(()=>{resize();clampPan();redraw()})}
async function loadFile(f){
  let u=null;const raw=await readFile(f);if(raw)u=await shrink(raw,2200,.92);
  if(!u){try{const ou=URL.createObjectURL(f);u=await shrink(ou,2200,.92);URL.revokeObjectURL(ou)}catch(e){}}
  if(!u)u=await viaBitmap(f,2200,.92);
  if(!u){toast(t('nophoto'));return}
  loadURL(u);
}
function loadURL(u,st){const im=new Image();im.onload=()=>{Object.assign(MS,{img:im,iw:im.naturalWidth,ih:im.naturalHeight,refs:[{len:MS.refs[0].len,pts:[]},{len:MS.refs[1].len,pts:[]}],cur:0,stroke:[],shapes:[],res:null,kfit:1});MS.step=1;
  if(st){const cp=a=>a.map(p=>p.slice());MS.refs=st.refs.map(r=>({len:r.len,pts:cp(r.pts)}));MS.two=!!st.two;MS.shapes=st.shapes.map(sh=>sh.map(p=>p.slice()));MS.apply=st.apply||'box';MS.cur=0;MS.step=2;MS.mode='draw'}
  ui();requestAnimationFrame(()=>{resize();fit()})};im.onerror=()=>toast(t('nophoto'));im.src=u}
function open(tgt){
  if(!root)build();reset();MS.tgt=tgt;root.hidden=false;document.documentElement.style.overflow='hidden';ui();
}
function close(){if(!root)return;root.hidden=true;document.documentElement.style.overflow='';MS.img=null;MS.lpt=null;MS.ptrs.clear()}

/* ---------- підстановка ---------- */
function annotated(R){
  const W=MS.iw,H=MS.ih,k=Math.min(1,(S.phq==='h'?1600:1000)/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);const g=c.getContext('2d');
  const sv=MS.step;MS.step=3;MS.res=R;paint(g,0,0,k,false);MS.step=sv;
  const txt=(R.n>1?'Σ'+R.n+'  ':'')+fmt(dA(R.A))+' '+UA()+'  ·  '+fmt(dU(R.L))+' × '+fmt(dU(R.W))+' '+UL();g.font='700 '+Math.max(14,Math.round(c.width/32))+'px system-ui,sans-serif';
  const fh=Math.max(14,Math.round(c.width/32)),pad=Math.round(fh*.45);g.fillStyle='rgba(15,18,24,.78)';g.fillRect(0,c.height-fh-pad*2,c.width,fh+pad*2);g.fillStyle='#fff';g.textBaseline='middle';g.fillText(txt,pad*1.4,c.height-fh/2-pad);
  return c.toDataURL('image/jpeg',S.phq==='h'?.8:.7);
}
function metaOf(){const r1=p=>[Math.round(p[0]*10)/10,Math.round(p[1]*10)/10];return{v:1,src:MS.img.src,refs:MS.refs.map(r=>({len:r.len,pts:r.pts.map(r1)})),two:MS.two,shapes:MS.shapes.map(sh=>sh.map(r1)),apply:MS.apply,j:MS.tgt.j}}
async function putPhoto(id,R){const u=annotated(R),m=metaOf();PHC[id]=u;PHC[id+'_m']=m;await DB.put('ph',id,u);await DB.put('ph',id+'_m',m)}
async function applyRes(){
  const R=MS.res,TG=MS.tgt;if(!R||!TG)return;
  const par=S.dents[TG.i];if(!par){close();return}
  const o=TG.j!=null?(par.sub||[])[TG.j]:par,ed=MS.edit;
  if(!o&&!ed){close();return}
  if(o){let L=R.L,W=R.W;if(MS.apply==='area'){L=R.L2;W=R.W2}
    o.len=Math.max(0.1,Math.round(L*100)/100);o.wid=Math.max(0.1,Math.round(W*100)/100)}
  if(ed){if((par.ph||[]).includes(ed.id)){try{await putPhoto(ed.id,R)}catch(e){}}}
  else if(MS.addPh){par.ph=par.ph||[];if(par.ph.length<8){try{const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await putPhoto(id,R);par.ph.push(id)}catch(e){}}}
  save();render();close();toast(t(ed?'mredone':'mdone'));
}
/* повторне редагування збереженого вимірювання з розділу «Фото» */
function edit(i,k){
  const par=S.dents[i];if(!par)return;const id=(par.ph||[])[k],m=id&&PHC[id+'_m'];
  if(!m||!m.src||!m.refs){toast(t('nophoto'));return}
  if(!root)build();reset();MS.tgt={i,j:m.j==null?null:m.j};MS.edit={id};
  root.hidden=false;document.documentElement.style.overflow='hidden';ui();loadURL(m.src,m);
}
document.addEventListener('click',e=>{const pe=e.target.closest&&e.target.closest('[data-phed]');if(pe){const a=String(pe.dataset.phed).split('.');edit(+a[0],+a[1]);return}const b=e.target.closest&&e.target.closest('[data-msr]');if(!b)return;const a=String(b.dataset.msr).split('.');open({i:+a[0],j:a.length>1?+a[1]:null})});
window.MSR={open,edit,MS,compute,calib,loadURL};
})();

</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
