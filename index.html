const DB={db:null,mem:{ph:{},arch:{},aph:{}},
 open(){return new Promise(res=>{try{const r=indexedDB.open('pdrdb',1);r.onupgradeneeded=()=>{['ph','arch','aph'].forEach(n=>r.result.createObjectStore(n))};r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>res();r.onblocked=()=>res()}catch(e){res()}})},
 _t(st,mode,fn){return new Promise((res,rej)=>{try{const tx=DB.db.transaction(st,mode),o=tx.objectStore(st);const rq=fn(o);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=tx.onabort=()=>rej(tx.error)}catch(e){rej(e)}})},
 async put(st,k,v){if(!DB.db){DB.mem[st][k]=v;return}try{await DB._t(st,'readwrite',o=>o.put(v,k))}catch(e){DB.mem[st][k]=v}},
 async get(st,k){if(!DB.db)return DB.mem[st][k];try{return await DB._t(st,'readonly',o=>o.get(k))}catch(e){return DB.mem[st][k]}},
 async del(st,k){delete DB.mem[st][k];if(DB.db){try{await DB._t(st,'readwrite',o=>o.delete(k))}catch(e){}}},
 async clear(st){DB.mem[st]={};if(DB.db){try{await DB._t(st,'readwrite',o=>o.clear())}catch(e){}}},
 async all(st){if(!DB.db)return Object.keys(DB.mem[st]).map(k=>({k,v:DB.mem[st][k]}));return new Promise((res,rej)=>{try{const out=[];const tx=DB.db.transaction(st,'readonly'),rq=tx.objectStore(st).openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out.push({k:c.key,v:c.value});c.continue()}};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}})}};
function shrink(src,max,q){return new Promise(res=>{const im=new Image();im.onload=()=>{try{let w=im.naturalWidth,h=im.naturalHeight;if(!w||!h){res(null);return}const k=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q))}catch(e){res(null)}};im.onerror=()=>res(null);im.src=src})}
async function viaBitmap(f,max,q){try{const bm=await createImageBitmap(f);const k=Math.min(1,max/Math.max(bm.width,bm.height));const w=Math.max(1,Math.round(bm.width*k)),h=Math.max(1,Math.round(bm.height*k));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bm,0,0,w,h);return c.toDataURL('image/jpeg',q)}catch(e){return null}}

async function addPhotos(i,files){const d=S.dents[i];if(!d||!files)return;d.ph=d.ph||[];let bad=false;
